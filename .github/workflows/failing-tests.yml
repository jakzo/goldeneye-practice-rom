name: Focused failing tests

on:
  push:
    branches:
      - agent/fix-failing-actions-tests
  workflow_dispatch:

permissions:
  contents: read

env:
  ARES_PREFIX: ${{ github.workspace }}/.cache/ares

jobs:
  build-ares:
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.ares-revision.outputs.cache-key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test test runners
        run: python3 -m unittest discover -s tests

      - name: Determine ares cache key
        id: ares-revision
        run: echo "cache-key=ares-${RUNNER_OS}-${RUNNER_ARCH}-$(git rev-parse HEAD:ares)" >> "$GITHUB_OUTPUT"

      - name: Cache ares
        id: cache-ares
        uses: actions/cache@v6
        with:
          path: ${{ env.ARES_PREFIX }}
          key: ${{ steps.ares-revision.outputs.cache-key }}

      - name: Checkout ares profiler submodule
        if: steps.cache-ares.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 ares

      - name: Install ares build dependencies
        if: steps.cache-ares.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            build-essential \
            cmake \
            libcanberra-gtk3-module \
            libcapstone-dev \
            libgl-dev \
            libgtk-3-dev \
            mesa-vulkan-drivers \
            ninja-build \
            pkg-config

      - name: Build ares
        if: steps.cache-ares.outputs.cache-hit != 'true'
        run: |
          cmake \
            -S ares \
            -B /tmp/ares-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ARES_PREFIX" \
            -DARES_CORES=n64 \
            -DARES_BUILD_LOCAL=OFF \
            -DARES_BUNDLE_SHADERS=OFF \
            -DARES_ENABLE_LIBRASHADER=OFF \
            -DENABLE_IPO=OFF \
            -DARES_ENABLE_ALSA=OFF \
            -DARES_ENABLE_AO=OFF \
            -DARES_ENABLE_OPENAL=OFF \
            -DARES_ENABLE_OSS=OFF \
            -DARES_ENABLE_PULSEAUDIO=OFF \
            -DARES_ENABLE_SDL=OFF \
            -DARES_ENABLE_UDEV=OFF
          cmake --build /tmp/ares-build --parallel 2
          cmake --install /tmp/ares-build

  practice-tests:
    needs: build-ares
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: EU
            code: e
            region: eu
            secret: BASE_ROM_EU_DOWNLOAD_LINK
          - version: JP
            code: j
            region: jp
            secret: BASE_ROM_JP_DOWNLOAD_LINK

    name: practice failures (${{ matrix.version }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout libdragon submodule
        run: git submodule update --init --depth 1 libdragon

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            binutils-mips-linux-gnu \
            ffmpeg \
            libcanberra-gtk3-module \
            libcapstone-dev \
            libgl-dev \
            libgtk-3-dev \
            make \
            mesa-vulkan-drivers \
            xauth \
            xvfb

      - name: Build pinned ROM toolchain image
        run: docker build --target goldeneye --tag goldeneye .

      - name: Download base ROMs
        env:
          BASE_ROM_US_URL: ${{ secrets.BASE_ROM_US_DOWNLOAD_LINK }}
          TARGET_BASE_ROM_URL: ${{ secrets[matrix.secret] }}
          TARGET_BASE_ROM: baserom.${{ matrix.code }}.z64
        run: |
          test -n "$BASE_ROM_US_URL"
          test -n "$TARGET_BASE_ROM_URL"
          curl --fail --location --retry 3 --output baserom.u.z64 "$BASE_ROM_US_URL"
          curl --fail --location --retry 3 --output "$TARGET_BASE_ROM" "$TARGET_BASE_ROM_URL"
          test "$(stat --format=%s baserom.u.z64)" -ge 1000000
          test "$(stat --format=%s "$TARGET_BASE_ROM")" -ge 1000000

      - name: Extract assets and build release ROM
        run: |
          ./scripts/extract_baserom.u.sh
          if [ "${{ matrix.code }}" = "e" ]; then
            ./scripts/extract_diff.e.sh
          else
            ./scripts/extract_diff.j.sh
          fi
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/home/dev" goldeneye \
            make -j"$(nproc)" VERSION=${{ matrix.version }} DEV=0

      - name: Restore ares cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ARES_PREFIX }}
          key: ${{ needs.build-ares.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run previously failing practice tests
        env:
          ARES: ${{ env.ARES_PREFIX }}/bin/ares
          ARES_ARGS: >-
            --fullscreen
            --no-file-prompt
            --setting Audio/Driver=None
            --setting Input/Driver=None
          XDG_CONFIG_HOME: /tmp/ares-config
          XDG_DATA_HOME: /tmp/ares-data
        run: |
          tasks=(--task practice/${{ matrix.region }}/MIGRATION_PHASE4)
          if [ "${{ matrix.version }}" = "EU" ]; then
            tasks=(
              --task practice/eu/REPLAY
              --task practice/eu/STATE_RUNWAY_INTRO_DEATH_LOAD
            )
          fi
          xvfb-run --auto-servernum \
            --server-args="-screen 0 640x480x24 -nolisten tcp -ac" \
            ./scripts/run_test_shard.py "${tasks[@]}"

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: focused-practice-${{ matrix.region }}-${{ github.run_attempt }}
          path: build/test-shards
          if-no-files-found: warn

  save-state-tests:
    needs: build-ares
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout test submodules
        run: git submodule update --init --depth 1 ares libdragon

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            ffmpeg \
            libcanberra-gtk3-module \
            libcapstone-dev \
            libgl-dev \
            libgtk-3-dev \
            make \
            mesa-vulkan-drivers \
            xauth \
            xvfb

      - name: Build pinned ROM toolchain image
        run: docker build --target goldeneye --tag goldeneye .

      - name: Download US base ROM
        env:
          BASE_ROM_US_URL: ${{ secrets.BASE_ROM_US_DOWNLOAD_LINK }}
        run: |
          test -n "$BASE_ROM_US_URL"
          curl --fail --location --retry 3 --output baserom.u.z64 "$BASE_ROM_US_URL"
          test "$(stat --format=%s baserom.u.z64)" -ge 1000000

      - name: Extract assets and build US release ROM
        run: |
          ./scripts/extract_baserom.u.sh
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/home/dev" goldeneye \
            make -j"$(nproc)" VERSION=US DEV=0

      - name: Restore ares cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ARES_PREFIX }}
          key: ${{ needs.build-ares.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run previously failing save-state replays
        env:
          ARES: ${{ env.ARES_PREFIX }}/bin/ares
          ARES_ARGS: >-
            --fullscreen
            --no-file-prompt
            --setting Audio/Driver=None
            --setting Input/Driver=None
          XDG_CONFIG_HOME: /tmp/ares-config
          XDG_DATA_HOME: /tmp/ares-data
        run: |
          xvfb-run --auto-servernum \
            --server-args="-screen 0 640x480x24 -nolisten tcp -ac" \
            ./scripts/run_test_shard.py \
              --task save-state/us/default/01-dam \
              --task save-state/us/cameras/01-dam \
              --task save-state/us/cameras/02-facility

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: focused-save-state-${{ github.run_attempt }}
          path: build/test-shards
          if-no-files-found: warn
